services:
  postgres:
    image: postgres:16-alpine
    container_name: flowpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flowpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flowpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: flowpulse-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    environment:
      PORT: ${BACKEND_PORT:-3001}
      NODE_ENV: development
      GLOBAL_PREFIX: ${GLOBAL_PREFIX:-api/v1}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flowpulse?schema=public
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    container_name: flowpulse-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      - api

volumes:
  postgres_data:
